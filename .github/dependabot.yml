version: 2
updates:
  - package-ecosystem: nuget
    # NOT directory: "/". Two entries exist so the NuGet updater gets two ~55-minute caps instead
    # of one it cannot fit inside (see the comment below). Scoping by `directory` was tried in #215
    # and reverted in #217: dependabot does not walk down to find project files, and src/ holds none
    # directly — they are at src/<layer>/<package>/. Both jobs logged "No project files found." and
    # reported SUCCESS in 80 seconds, which is the same silent-green shape this whole file is about.
    # `directories` takes globs, so the depth is stated explicitly rather than assumed.
    directories:
      - "/src/*/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Cohesive multi-package families are grouped so a single shared version moves in ONE PR
    # (incl. major bumps). Without this, families that pin one core version across several packages
    # — e.g. FluentMigrator + its per-engine runners — produce separate, mutually-conflicting PRs
    # that Dependabot then auto-closes as "no longer updatable". Pattern groups are listed BEFORE
    # the catch-all nuget-minor-patch so a matching dependency joins its family group first.
    #
    # ORDER IS LOAD-BEARING, and not only for the catch-all. The NuGet updater re-runs full project
    # discovery per dependency, and discovery of this repo is expensive — 145 csproj, central package
    # management, 36 projects on two TFMs. Measured on the 2026-08-10 and 2026-08-17 runs: the first
    # discovery alone took 10m46s, each re-run 4-17s, 154 discoveries in total, and the job was killed
    # by the ~55-minute cap having analyzed 18 of 77 dependencies. Both runs ended
    # "##[error]The operation was canceled." within one second of the same duration.
    #
    # Dependabot analyses groups in the order declared here, so whatever sits below roughly the first
    # 20 dependencies is never reached at all. The order is therefore risk-first: security-facing and
    # runtime packages before build-time tooling, and test-only families last. This does NOT fix the
    # timeout — it decides which dependencies get the time there is.
    groups:
      aspnetcore:
        # First deliberately: CLAUDE.md requires Microsoft.AspNetCore.* to stay patched.
        patterns:
          - "Microsoft.AspNetCore.*"
      identitymodel:
        # The Microsoft.IdentityModel.* family must be version-consistent (a split bump breaks token
        # validation); keep them in one PR. Note they are pinned to override JwtBearer's transitive
        # version, so review the bump against the ASP.NET Core version — see MIGRATION.md 0.6.5.
        patterns:
          - "Microsoft.IdentityModel.*"
          - "System.IdentityModel.Tokens.Jwt"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      efcore:
        # Carries Npgsql, i.e. a database driver, which is why it sits above the build-time families.
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
          - "EFCore.NamingConventions"
      fluentmigrator:
        patterns:
          - "FluentMigrator*"
      quartz:
        patterns:
          - "Quartz*"
      serilog:
        patterns:
          - "Serilog*"
      aws-sdk:
        patterns:
          - "AWSSDK*"
      roslyn:
        # Build-time only (analyzers, source generators) — below anything that ships at runtime.
        patterns:
          - "Microsoft.CodeAnalysis*"
      # Catch-all for everything else: bundle remaining minor/patch updates into one PR.
      # Must stay LAST — it has no patterns, so it would otherwise grab every dependency first.
      #
      # WARNING: nothing here is currently reached before the timeout, and the ungrouped set includes
      # security-facing packages — SSH.NET (which needed a manual pin for GHSA-q939-rpr3-3284 in #209),
      # Microsoft.Data.SqlClient, MySqlConnector, StackExchange.Redis, Konscious…Argon2, MessagePack.
      # Reordering above does not solve that; only cutting the per-job discovery cost will.
      nuget-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directories:
      - "/tests/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - tests
    # Test-only dependencies in their own job, so they stop competing for the same cap as the
    # packages that ship: a stale test dependency costs a developer minutes, a stale runtime one can
    # cost a consumer an advisory. Test csproj sit one level down (tests/<package>/), hence "/tests/*"
    # rather than the "/src/*/*" the source tree needs.
    groups:
      testcontainers:
        patterns:
          - "Testcontainers*"
      xunit:
        patterns:
          - "xunit*"
      verify:
        patterns:
          - "Verify.*"
      nuget-test-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - ci
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
