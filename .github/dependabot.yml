version: 2
updates:
  - package-ecosystem: nuget
    # NOT the repository root. Dependabot discovers the three tiny projects in this directory
    # instead of the 145-project solution, and still edits the root Directory.Packages.props —
    # see .github/dependabot-nuget/README.md for why, and PRs #214–#219 for what did not work.
    #
    # Against the real solution the updater's per-dependency re-discovery hit the fixed 55-minute
    # cap on every weekly run from 2026-07-27 to 2026-08-21, having analysed 11–18 of 78 packages.
    # No NuGet update PR was produced in that time. Discovery here takes seconds.
    directory: "/.github/dependabot-nuget"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Cohesive multi-package families are grouped so a single shared version moves in ONE PR
    # (incl. major bumps). Without this, families that pin one core version across several packages
    # — e.g. FluentMigrator + its per-engine runners — produce separate, mutually-conflicting PRs
    # that Dependabot then auto-closes as "no longer updatable". Pattern groups are listed BEFORE
    # the catch-all nuget-minor-patch so a matching dependency joins its family group first.
    #
    # Order is still analysis order (measured on #214), so it stays risk-first: security-facing and
    # runtime packages before build-time tooling, test-only families last. With discovery no longer
    # the bottleneck the whole list should be reached; the order now decides PR sequence, not survival.
    groups:
      aspnetcore:
        # First deliberately: CLAUDE.md requires Microsoft.AspNetCore.* to stay patched.
        patterns:
          - "Microsoft.AspNetCore.*"
      identitymodel:
        # The Microsoft.IdentityModel.* family must be version-consistent (a split bump breaks token
        # validation); keep them in one PR. Note they are pinned to override JwtBearer's transitive
        # version, so review the bump against the ASP.NET Core version — see MIGRATION.md 0.6.5.
        patterns:
          - "Microsoft.IdentityModel.*"
          - "System.IdentityModel.Tokens.Jwt"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      efcore:
        # Carries Npgsql, i.e. a database driver, which is why it sits above the build-time families.
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
          - "EFCore.NamingConventions"
      fluentmigrator:
        patterns:
          - "FluentMigrator*"
      quartz:
        patterns:
          - "Quartz*"
      serilog:
        patterns:
          - "Serilog*"
      aws-sdk:
        patterns:
          - "AWSSDK*"
      roslyn:
        # Build-time only (analyzers, source generators) — below anything that ships at runtime.
        patterns:
          - "Microsoft.CodeAnalysis*"
      testcontainers:
        # Test-only from here down: last to be analysed, because a stale test dependency costs a
        # developer minutes and a stale runtime one can cost a consumer an advisory.
        patterns:
          - "Testcontainers*"
      xunit:
        patterns:
          - "xunit*"
      # Catch-all for everything else: bundle remaining minor/patch updates into one PR.
      # Must stay LAST — it has no patterns, so it would otherwise grab every dependency first.
      # The ungrouped set includes security-facing packages (SSH.NET, Microsoft.Data.SqlClient,
      # MySqlConnector, StackExchange.Redis, Konscious…Argon2, MessagePack); under the old root
      # discovery none of them was ever reached.
      nuget-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - ci
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
